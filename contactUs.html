<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="ContactUs_style.css">
</head>
<body>
    <div class="center">
        <form action="#">

            <h1>Contact Us</h1>
            <div class="diff_divs">
                <!-- <label for="name">Name:</label > -->
                <input placeholder="First Name" type="text" maxlength="20" name="name" id="name" required>
                <input placeholder="Last Name" type="text" maxlength="20" name="name" id="name">
            </div>

            <br>

            <div class="diff_divs">
                <!-- <label for="email">Email ID:</label> -->
                <input placeholder="Email ID" type="email" name="email" id="email" required>
            </div>

            <br>

            <div class="diff_divs">
                <!-- <label for="issue">Issue:</label> -->
                <textarea  placeholder="Issue" id="issue" cols="50" required></textarea>
            </div>

            <br>

            <div class="submit">
                <input type="submit">
            </div>
        </form>
    </div>
</body>
</html>
